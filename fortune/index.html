<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 운세</title>
<style>
  :root {
    --gold: #d4af37;
    --gold-soft: #f1d98a;
    --bg1: #0a0818;
    --bg2: #1a1040;
    --ink: #e8e4f5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 0%, var(--bg2) 0%, var(--bg1) 70%) fixed;
    color: var(--ink);
    font-family: "Noto Serif KR", "Batang", Georgia, serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 16px 56px;
    overflow-x: hidden;
  }
  #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #fff; opacity: .2;
    animation: twinkle var(--d, 3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes twinkle { 50% { opacity: .95; transform: scale(1.8); } }

  main { position: relative; z-index: 1; width: 100%; max-width: 760px; text-align: center; }
  h1 {
    font-size: clamp(26px, 6vw, 38px); font-weight: 600; letter-spacing: .15em;
    color: var(--gold-soft); text-shadow: 0 0 18px rgba(212,175,55,.45);
  }
  .sub { margin: 10px 0 28px; color: #a9a3c7; font-size: 15px; }

  .deck {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 12px; max-width: 520px; margin: 0 auto 28px;
  }
  .card {
    aspect-ratio: 2 / 3.1; perspective: 900px; position: relative;
    transition: transform .5s, opacity .5s, filter .5s;
  }
  .inner {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transition: transform .9s cubic-bezier(.2,.7,.2,1);
  }
  .card.flipped .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 10px; border: 1.5px solid var(--gold);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .back {
    background:
      radial-gradient(circle at 50% 50%, rgba(212,175,55,.22), transparent 55%),
      repeating-linear-gradient(45deg, #1d1347 0 6px, #251a5c 6px 12px);
    box-shadow: 0 0 14px rgba(120,90,220,.35), inset 0 0 18px rgba(0,0,0,.5);
    color: var(--gold); font-size: clamp(20px, 5vw, 32px);
  }
  .front {
    transform: rotateY(180deg);
    background: linear-gradient(160deg, #2b1b6b, #120a30 70%);
    box-shadow: 0 0 28px var(--glow, rgba(212,175,55,.6));
    padding: 6px;
  }
  .sym { font-size: clamp(28px, 8vw, 54px); line-height: 1.1; }
  .nm { margin-top: 6px; font-size: clamp(11px, 2.6vw, 15px); color: var(--gold-soft); letter-spacing: .1em; }

  .deck.shuffling .card { animation: shuffle .9s ease-in-out; }
  .deck.shuffling .card:nth-child(even) { animation-direction: reverse; }
  @keyframes shuffle {
    25% { transform: translate(var(--sx, 20px), -10px) rotate(8deg); }
    60% { transform: translate(calc(var(--sx, 20px) * -1), 8px) rotate(-8deg); }
  }
  .deck.picked .card:not(.flipped) { opacity: .18; filter: blur(1px) grayscale(.6); transform: scale(.94); }
  .deck.picked .card.flipped { transform: scale(1.12); z-index: 2; }

  button {
    font: inherit; font-size: 17px; letter-spacing: .12em; cursor: pointer;
    color: #1a1040; background: linear-gradient(180deg, #f1d98a, var(--gold));
    border: 0; border-radius: 999px; padding: 14px 34px;
    box-shadow: 0 0 22px rgba(212,175,55,.45);
    transition: transform .15s, box-shadow .2s, opacity .2s;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 0 32px rgba(212,175,55,.75); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  .result {
    margin: 30px auto 0; max-width: 520px; padding: 24px 22px;
    border: 1px solid rgba(212,175,55,.4); border-radius: 14px;
    background: rgba(20,12,50,.65); backdrop-filter: blur(4px);
    opacity: 0; transform: translateY(12px); transition: opacity .8s, transform .8s;
    min-height: 0; visibility: hidden;
  }
  .result.show { opacity: 1; transform: none; visibility: visible; }
  .result h2 { color: var(--gold-soft); font-size: 22px; margin-bottom: 12px; letter-spacing: .1em; }
  .result p { line-height: 1.8; font-size: 16px; }
  .lucky { margin-top: 14px; font-size: 14px; color: #a9a3c7; }
  .lucky b { color: var(--gold-soft); font-weight: 600; }

  @media (max-width: 420px) { .deck { gap: 8px; } }
  @media (prefers-reduced-motion: reduce) {
    .star, .deck.shuffling .card { animation: none; }
    .inner, .result, .card { transition-duration: .01s; }
  }
</style>
</head>
<body>
<div id="stars" aria-hidden="true"></div>
<main>
  <h1>✦ 오늘의 운세 ✦</h1>
  <p class="sub">마음을 가다듬고, 오늘의 카드를 뽑아보세요</p>

  <div class="deck" id="deck"></div>
  <button id="draw">오늘의 운세 뽑기</button>

  <section class="result" id="result" aria-live="polite">
    <h2 id="rTitle"></h2>
    <p id="rMsg"></p>
    <p class="lucky" id="rLucky"></p>
  </section>
</main>

<script>
const CARDS = [
  { name: "별",   sym: "⭐", glow: "rgba(255,230,120,.7)", msg: "오랫동안 품어 온 소망이 길을 밝혀 줄 날입니다. 작은 영감 하나를 놓치지 말고 따라가 보세요.", color: "은빛 하늘색", num: 7 },
  { name: "달",   sym: "🌙", glow: "rgba(170,190,255,.7)", msg: "직감이 평소보다 예리한 하루입니다. 서두르지 말고 마음의 소리에 귀 기울이면 답이 보입니다.", color: "진주색", num: 2 },
  { name: "태양", sym: "☀️", glow: "rgba(255,180,60,.75)", msg: "에너지가 넘치고 하는 일마다 빛이 납니다. 망설였던 일을 시작하기에 더없이 좋은 날입니다.", color: "황금색", num: 1 },
  { name: "행운", sym: "🍀", glow: "rgba(90,230,140,.7)",  msg: "뜻밖의 좋은 소식이나 만남이 찾아옵니다. 열린 마음으로 기회를 맞이하세요.", color: "에메랄드", num: 8 },
  { name: "사랑", sym: "💖", glow: "rgba(255,110,170,.7)", msg: "주변 사람들과의 관계가 따뜻해지는 날입니다. 고마운 마음을 표현해 보세요, 배로 돌아옵니다.", color: "장밋빛", num: 6 },
  { name: "용기", sym: "🦁", glow: "rgba(255,120,70,.7)",  msg: "한 걸음 내딛는 순간 길이 열립니다. 두려움보다 설렘에 집중하면 좋은 결과가 따릅니다.", color: "주홍색", num: 5 },
  { name: "지혜", sym: "🦉", glow: "rgba(150,120,255,.75)",msg: "차분히 생각하면 복잡한 문제도 풀립니다. 조언을 구하거나 기록하며 정리해 보세요.", color: "보랏빛", num: 3 },
  { name: "변화", sym: "🦋", glow: "rgba(90,210,240,.7)",  msg: "새로운 흐름이 다가옵니다. 익숙한 것을 조금 바꿔 보면 행운의 문이 열릴 거예요.", color: "청록색", num: 9 },
];

const deck = document.getElementById("deck");
const btn = document.getElementById("draw");
const result = document.getElementById("result");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let last = -1, busy = false;

// 배경 별
const stars = document.getElementById("stars");
for (let i = 0; i < 70; i++) {
  const s = document.createElement("i");
  s.className = "star";
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*4}s`;
  stars.appendChild(s);
}

// 카드 8장 (뒷면)
CARDS.forEach((c) => {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <div class="inner">
      <div class="face back">✧</div>
      <div class="face front" style="--glow:${c.glow}">
        <div class="sym">${c.sym}</div><div class="nm">${c.name}</div>
      </div>
    </div>`;
  deck.appendChild(el);
});
const els = [...deck.children];

const wait = (ms) => new Promise((r) => setTimeout(r, reduceMotion ? 0 : ms));

function reset() {
  els.forEach((e) => e.classList.remove("flipped"));
  deck.classList.remove("picked");
  result.classList.remove("show");
}

btn.addEventListener("click", async () => {
  if (busy) return;
  busy = true; btn.disabled = true;

  const wasPicked = deck.classList.contains("picked");
  reset();
  if (wasPicked) await wait(700);

  deck.style.setProperty("--sx", (deck.clientWidth / 8) + "px");
  deck.classList.add("shuffling");
  await wait(900);
  deck.classList.remove("shuffling");

  let i;
  do { i = Math.floor(Math.random() * CARDS.length); } while (i === last && CARDS.length > 1);
  last = i;
  const c = CARDS[i];

  els[i].classList.add("flipped");
  deck.classList.add("picked");
  await wait(900);

  document.getElementById("rTitle").textContent = `${c.sym} ${c.name}`;
  document.getElementById("rMsg").textContent = c.msg;
  document.getElementById("rLucky").innerHTML = `행운의 색 <b>${c.color}</b> · 행운의 숫자 <b>${c.num}</b>`;
  result.classList.add("show");
  result.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });

  btn.textContent = "다시 뽑기";
  btn.disabled = false; busy = false;
});
</script>
</body>
</html>
